[package]
name = "spacegraph-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
spacegraph-core = { path = "../spacegraph-core" }

anyhow = "1"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }

crossbeam-channel = "0.5"
smallvec = "1"

bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "x11",
    "tonemapping_luts",
] }
bevy_egui = "0.28"
# Pinned exactly: 0.19.2 is the last bevy_panorbit_camera that targets
# bevy 0.14 + bevy_egui ^0.28 (the egui feature avoids stealing pointer input
# over UI panels). Newer releases require bevy_egui 0.29+.
bevy_panorbit_camera = { version = "=0.19.2", features = ["bevy_egui"] }

[features]
# Opt-in UI sound effects (scan/alert/mission/pick). Pulls bevy_audio + the WAV
# decoder; on Linux this needs the ALSA dev libs at build time.
audio = ["bevy/bevy_audio", "bevy/wav"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Pinned to the version already in Cargo.lock (transitive wgpu/bevy dep); used
# only to validate the post-process WGSL headlessly.
naga = { version = "=0.20.0", features = ["wgsl-in"] }

[[bench]]
name = "layout"
harness = false
