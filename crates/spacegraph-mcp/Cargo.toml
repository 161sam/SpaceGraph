[package]
name = "spacegraph-mcp"
version = "0.1.0"
edition = "2021"
description = "Standalone read-only MCP stdio server hosting the headless SpaceGraph GraphCore — the ESN provider surface (ADR-0001). Read-only tools only (O-7'); no Bevy."

[lib]
name = "spacegraph_mcp"
path = "src/lib.rs"

[[bin]]
name = "spacegraph-mcp"
path = "src/main.rs"

[dependencies]
spacegraph-core = { path = "../spacegraph-core" }
spacegraph-graph = { path = "../spacegraph-graph" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
# spacegraph-graph::net::spawn_reader takes a tokio mpsc Receiver for the
# (unused here, read-only) outbound channel; we hold its Sender open.
tokio = { version = "1", features = ["sync"] }
